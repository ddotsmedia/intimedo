services:
  web:
    build: .
    image: intimedo-web:local
    environment:
      DATABASE_URL: postgresql://intimedo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${DB_NAME:-intimedo}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intimedo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-intimedo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intimedo -d intimedo"]
      interval: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  db-data:
