# Manual production deploy. Runs only from the Actions tab (workflow_dispatch).
# Secrets follow the Oct 22, 2026 standard. UNVERIFIED until a host and secrets exist.
name: Deploy production
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      BETTER_AUTH_SECRET: ${{ secrets.INTIMEDO_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Build and push image (runs on the runner)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t ghcr.io/ddotsmedia/intimedo-web:${IMAGE_TAG} .
          docker push ghcr.io/ddotsmedia/intimedo-web:${IMAGE_TAG}
          docker build --target migrate -t ghcr.io/ddotsmedia/intimedo-migrate:${IMAGE_TAG} .
          docker push ghcr.io/ddotsmedia/intimedo-migrate:${IMAGE_TAG}
      - name: Record currently running image (for rollback)
        id: prev
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          CID=$(docker compose -f compose.yaml -f docker-compose.prod.yml ps -q web 2>/dev/null || true)
          REF=""
          if [ -n "$CID" ]; then REF=$(docker inspect -f '{{.Config.Image}}' "$CID" || true); fi
          echo "previous=$REF" >> "$GITHUB_OUTPUT"
          echo "previous image: ${REF:-none}"
      - name: Deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          docker compose -f compose.yaml -f docker-compose.prod.yml pull web migrate
          docker compose -f compose.yaml -f docker-compose.prod.yml up -d --no-build db
          docker compose -f compose.yaml -f docker-compose.prod.yml run --rm migrate
          docker compose -f compose.yaml -f docker-compose.prod.yml up -d --no-build
      - name: Verify health
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          for i in $(seq 1 12); do
            if docker compose -f compose.yaml -f docker-compose.prod.yml exec -T web wget -qO- http://127.0.0.1:3000/api/health | grep -q '"ok"'; then
              echo HEALTHY; exit 0
            fi
            sleep 5
          done
          echo "health check failed"; exit 1
      - name: Roll back to previous image on failure (migrations are not reversed)
        if: failure() && steps.prev.outputs.previous != ''
        env:
          DOCKER_HOST: ssh://${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PREVIOUS: ${{ steps.prev.outputs.previous }}
        run: |
          PREV_TAG="${PREVIOUS##*:}"
          export IMAGE_TAG="$PREV_TAG"
          docker compose -f compose.yaml -f docker-compose.prod.yml pull web
          docker compose -f compose.yaml -f docker-compose.prod.yml up -d --no-build
          echo "rolled back to $PREV_TAG"
