name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intimedo
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: intimedo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intimedo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://intimedo:ci@localhost:5432/intimedo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          BETTER_AUTH_SECRET: ci-test-secret-not-used-at-runtime-00000000
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-secret-not-used-at-runtime-00000000
          BETTER_AUTH_URL: http://localhost:3000

  restore-test:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intimedo
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: intimedo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intimedo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://intimedo:ci@localhost:5432/intimedo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: scripts/backup.sh "$RUNNER_TEMP/backups" | tee /tmp/dump-path
      - run: scripts/restore-test.sh "$(cat /tmp/dump-path)"

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intimedo
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: intimedo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intimedo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://intimedo:ci@localhost:5432/intimedo
      BETTER_AUTH_SECRET: ci-e2e-secret-not-used-in-production-000000
      BETTER_AUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: TEMP debug sign-up
        run: |
          npm run start -- -p 3100 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 8
          curl -s -i -X POST http://127.0.0.1:3100/api/auth/sign-up/email -H 'content-type: application/json' -H 'origin: http://127.0.0.1:3100' -d '{"email":"dbg@example.test","password":"correct-horse-battery-1","name":"Dbg"}' | head -c 1500
          echo; echo ---LOG; tail -c 4000 "$RUNNER_TEMP/server.log"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t intimedo-web:ci .
      - run: docker build --target migrate -t intimedo-migrate:ci .
