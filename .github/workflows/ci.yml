name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intimedo
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: intimedo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intimedo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://intimedo:ci@localhost:5432/intimedo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t intimedo-web:ci .
